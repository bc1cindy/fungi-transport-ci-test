[package]
name = "fungi-transport-e2e"
description = "End-to-end peer driver for the NixOS VM test network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fungi-transport = { path = "../fungi-transport" }
fungi-transport-arti = { path = "../fungi-transport-arti" }
# The driver needs arti config types directly for --private-net:
arti-client = { version = "=0.45.0", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
] }
# `RsaIdentity` / `Ed25519Identity` (authority + fallback-cache identity
# types used by `arti_client::config::dir`) are not re-exported through
# arti-client; the driver's --private-net config needs them directly.
# Pinned to the version already in Cargo.lock via arti-client's own
# dependency tree (verified Task 1).
tor-llcrypto = "=0.45.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true
