name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Slow job to run on demand'
        type: choice
        options:
          - smoke
          - e2e
          - both
        default: smoke
jobs:
  # Fast crane checks (nextest, clippy, fmt, doc): every PR and every push,
  # pinned by flake.lock. Built by name so the slow cross-backend VM test
  # (a separate check) stays off the PR path.
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      # TODO: add a nix cache once first-run wall-clock is measured (magic-nix-cache was sunset)
      - run: |
          nix build -L \
            .#checks.x86_64-linux.nextest \
            .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.fmt \
            .#checks.x86_64-linux.doc

  # Cross-backend onion VM test (~1h, deterministic): after merge to main, or
  # on demand via the workflow_dispatch "job" input. Never on the PR path — the
  # shared-random cycle it waits on is inherently slow.
  e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'e2e' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The tor-e2e check boots NixOS VMs, which need KVM. The runner exposes
      # /dev/kvm but the runner user is not in the kvm group; grant world access
      # via a udev rule and re-trigger so the node it applies to picks it up.
      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The arti build plus the VM disk images are large; the stock runner image
      # ships toolchains that crowd the disk. Reclaim space before the build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix build -L .#checks.x86_64-linux.tor-e2e

  # Real-network smoke: the ignored end-to-end test against the LIVE Tor
  # network. A flaky monitor, not a gate — it runs on the nightly schedule or
  # on demand via workflow_dispatch, and reports whether the strict production
  # path still bootstraps and connects. A red run is a signal to investigate.
  smoke:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'smoke' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop -c cargo test -p fungi-transport-arti --test smoke -- --ignored --nocapture
